name: Fix icon
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: |
          python - <<'EOF'
          from PIL import Image
          import glob
          d='app/src/main/res/'
          src=Image.open(d+'mipmap-xxxhdpi/ic_launcher.png').convert('RGBA')
          cx,cy,half=101,95,62
          win=src.crop((cx-half,cy-half,cx+half,cy+half))
          for f in glob.glob(d+'mipmap-*/ic_launcher.png'):
              size=Image.open(f).size
              win.resize(size,Image.LANCZOS).convert('RGBA').save(f)
          EOF
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add app/src/main/res
          git commit -m "Zoom launcher icon"
          git push
