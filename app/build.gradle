plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localProps.load(new FileInputStream(localPropsFile))
}
def supabaseUrl = localProps.getProperty('SUPABASE_URL') ?: System.getenv('SUPABASE_URL') ?: ''
def supabaseAnonKey = localProps.getProperty('SUPABASE_ANON_KEY') ?: System.getenv('SUPABASE_ANON_KEY') ?: ''

android {
    namespace 'com.vgkontact.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.vgkontact.app"
        minSdk 24
        targetSdk 34
        def versionCodeEnv = System.getenv('VERSION_CODE')
        def resolvedVersionCode = versionCodeEnv != null ? versionCodeEnv.toInteger() : 1
        versionCode resolvedVersionCode
        versionName "1.0.${resolvedVersionCode}"

        buildConfigField "String", "SUPABASE_URL", "\"${supabaseUrl}\""
        buildConfigField "String", "SUPABASE_ANON_KEY", "\"${supabaseAnonKey}\""
    }

    signingConfigs {
        debug {
            storeFile file("${rootProject.projectDir}/app/debug.keystore")
            storePassword "vgkontactdebug"
            keyAlias "vgkontactdebugkey"
            keyPassword "vgkontactdebug"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'androidx.security:security-crypto:1.1.0-alpha07'
}
