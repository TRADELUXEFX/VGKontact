name: Generate Release Keystore (run once, then delete this file)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check password secret is set
        run: |
          if [ -z "${{ secrets.TEMP_KEYSTORE_PASSWORD }}" ]; then
            echo "::error::TEMP_KEYSTORE_PASSWORD secret is empty or missing. Add it in Settings > Secrets and variables > Actions before running this workflow."
            exit 1
          fi
          echo "Password secret is present (length check only, value hidden)."

      - name: Set up JDK (for keytool)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore release.keystore \
            -alias vgkontact \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ secrets.TEMP_KEYSTORE_PASSWORD }}" \
            -dname "CN=VGKontact, OU=VGKontact, O=Teamlimitless, L=Lagos, ST=Lagos, C=NG"

      - name: Verify keystore is real and non-empty
        run: |
          SIZE=$(stat -c%s release.keystore)
          echo "release.keystore size: $SIZE bytes"
          if [ "$SIZE" -lt 100 ]; then
            echo "::error::release.keystore is suspiciously small ($SIZE bytes) - generation likely failed."
            exit 1
          fi
          keytool -list -v -keystore release.keystore -storepass "${{ secrets.TEMP_KEYSTORE_PASSWORD }}" | head -20

      - name: Print base64 text (copy this directly from the log)
        run: |
          echo "===COPY EVERYTHING BETWEEN THE LINES BELOW==="
          echo "-----BEGIN-----"
          base64 -w0 release.keystore
          echo ""
          echo "-----END-----"
          echo "===STOP COPYING HERE==="
          echo "Base64 length: $(base64 -w0 release.keystore | wc -c) characters"
