name: Generate Release Keystore (run once, then delete this file)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK (for keytool)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore release.keystore \
            -alias vgkontact \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ secrets.TEMP_KEYSTORE_PASSWORD }}" \
            -dname "CN=VGKontact, OU=VGKontact, O=Teamlimitless, L=Lagos, ST=Lagos, C=NG"

      - name: Print base64 text (copy this directly from the log)
        run: |
          echo "===COPY EVERYTHING BETWEEN THE LINES BELOW==="
          echo "-----BEGIN-----"
          base64 -w0 release.keystore
          echo ""
          echo "-----END-----"
          echo "===STOP COPYING HERE==="

      - name: Upload keystore as artifact (backup only)
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: release.keystore
          retention-days: 1
