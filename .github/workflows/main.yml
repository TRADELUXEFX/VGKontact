name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # -d decodes, -i tells base64 to ignore any characters that
      # aren't valid base64 (stray newlines/spaces from pasting the
      # secret on a phone), which is what caused "Tag number over 30
      # is not supported" last run - that error means the .keystore
      # file was corrupted/truncated, not a wrong password.
      - name: Decode release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d -i > app/release.keystore
          ls -la app/release.keystore
          # Sanity-check the file is a real, readable keystore before
          # even trying to build - fails fast with a clear message
          # instead of the cryptic R8/packaging error from before.
          keytool -list -storetype PKCS12 -keystore app/release.keystore \
            -storepass "${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" || \
            (echo "::error::release.keystore is not a valid keystore, or RELEASE_KEYSTORE_PASSWORD is wrong. Re-generate/re-copy the RELEASE_KEYSTORE_BASE64 secret." && exit 1)

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VERSION_CODE: ${{ github.run_number }}
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/app/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Rename APK for release
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/VGKontact-${{ github.run_number }}.apk

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: VGKontact build ${{ github.run_number }}
          files: app/build/outputs/apk/release/VGKontact-${{ github.run_number }}.apk
          generate_release_notes: true

      - name: Log build in Supabase (unapproved)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RELEASE_ASSETS: ${{ steps.create_release.outputs.assets }}
        run: |
          DOWNLOAD_URL=$(echo "$RELEASE_ASSETS" | jq -r '.[0].browser_download_url')
          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "Could not resolve APK download URL from release assets output" >&2
            exit 1
          fi

          curl -X POST "$SUPABASE_URL/rest/v1/app_releases" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{
              "version_code": ${{ github.run_number }},
              "version_name": "1.0.${{ github.run_number }}",
              "download_url": "'"$DOWNLOAD_URL"'",
              "changelog": "Automated build ${{ github.run_number }}"
            }' \
            --fail-with-body
