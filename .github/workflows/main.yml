name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Needed for the "Create GitHub Release" step below - the default
# GITHUB_TOKEN is read-only on contents by default on many repos,
# and creating a release requires write access.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Renaming before release so the download link/filename is
      # stable and readable (e.g. VGKontact-42.apk) rather than the
      # generic app-debug.apk every build produces.
      - name: Rename APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/VGKontact-${{ github.run_number }}.apk

      # Creates a real, permanent, publicly-linkable GitHub Release -
      # different from the artifact upload above, which is temporary
      # and tied to this specific workflow run (and typically expires).
      # This is the URL the app-side update check should actually point
      # users toward.
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: VGKontact build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/VGKontact-${{ github.run_number }}.apk
          generate_release_notes: true

      # Keeps app_version in Supabase pointing at whatever just got
      # released, automatically - so publishing a build and updating
      # the "latest version" the app checks against happen in the same
      # push, not as two separate manual steps that can drift out of
      # sync with each other.
      #
      # Uses the service_role key, NOT the anon key the app itself
      # uses - anon deliberately has read-only access to app_version
      # (see the SQL that created this table), so anyone who extracts
      # the anon key from the APK can never fake a version update.
      # service_role bypasses RLS entirely, which is correct here since
      # this step only runs inside your own trusted CI, never inside
      # the app.
      #
      # REQUIRES a new repo secret: SUPABASE_SERVICE_ROLE_KEY.
      # Add it at: Settings -> Secrets and variables -> Actions ->
      # New repository secret. Get the actual key from Supabase
      # dashboard -> Project Settings -> API -> service_role (the
      # "secret" one, not anon/public). Treat this like a password -
      # it bypasses every RLS policy in your database.
      - name: Update latest version in Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -X POST "$SUPABASE_URL/rest/v1/app_version" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{
              "latest_version_code": ${{ github.run_number }},
              "latest_version_name": "1.0.${{ github.run_number }}",
              "download_url": "https://github.com/${{ github.repository }}/releases/tag/v${{ github.run_number }}",
              "changelog": "Automated build ${{ github.run_number }}"
            }' \
            --fail-with-body
