name: ONE-TIME - Generate Debug Keystore

# Run this manually from the Actions tab ONCE. It creates a permanent
# debug.keystore file and commits it to the repo so every future CI
# build signs with the same key (fixes "can't install update, must
# uninstall first" errors). After it runs successfully once, DELETE
# this workflow file - it should never run a second time, or it would
# overwrite the keystore and break updates again.

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fail if keystore already exists
        run: |
          if [ -f "app/debug.keystore" ]; then
            echo "app/debug.keystore already exists - refusing to overwrite it."
            echo "If you really want to regenerate it, delete app/debug.keystore manually first."
            exit 1
          fi

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/debug.keystore \
            -storepass vgkontactdebug \
            -alias vgkontactdebugkey \
            -keypass vgkontactdebug \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=VGKontact Debug, OU=Dev, O=VGKontact, L=Lagos, S=Lagos, C=NG"

      - name: Commit keystore to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/debug.keystore
          git commit -m "Add stable debug keystore for consistent app signing"
          git push
